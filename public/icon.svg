<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fb923c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Rocket emoji representation -->
  <g transform="translate(256,256) scale(0.8)">
    <!-- Rocket body -->
    <ellipse cx="0" cy="-20" rx="50" ry="90" fill="white"/>
    <!-- Rocket tip -->
    <path d="M0,-130 L-30,-60 L30,-60 Z" fill="#14b8a6"/>
    <!-- Window -->
    <circle cx="0" cy="-40" r="25" fill="#14b8a6"/>
    <circle cx="0" cy="-40" r="18" fill="#99f6e4"/>
    <!-- Fins -->
    <path d="M-50,30 L-80,80 L-40,60 Z" fill="#14b8a6"/>
    <path d="M50,30 L80,80 L40,60 Z" fill="#14b8a6"/>
    <!-- Flame -->
    <ellipse cx="0" cy="90" rx="30" ry="45" fill="#fbbf24"/>
    <ellipse cx="0" cy="85" rx="18" ry="30" fill="#fef3c7"/>
  </g>
</svg>
